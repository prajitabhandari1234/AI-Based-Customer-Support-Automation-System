services:
  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_API_TIMEOUT_MS: ${VITE_API_TIMEOUT_MS:-30000}
        VITE_ENABLE_DEMO_ACCOUNTS: ${VITE_ENABLE_DEMO_ACCOUNTS:-false}
    environment:
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:8080}
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    restart: unless-stopped
