server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Local Docker example:
    #   http://backend:8080
    #
    # Azure Container Apps example:
    #   https://aics-backend.<environment>.<region>.azurecontainerapps.io

    location /api/ {
        proxy_pass ${BACKEND_API_URL};

        proxy_http_version 1.1;

        # Pass the backend hostname to the upstream application.
        proxy_set_header Host $proxy_host;

        # Forward useful client/proxy information.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required when BACKEND_API_URL uses HTTPS on Azure Container Apps.
        # Azure ingress requires the correct hostname during the TLS handshake.
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /actuator/ {
        proxy_pass ${BACKEND_API_URL};

        proxy_http_version 1.1;

        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for HTTPS backend connections on Azure Container Apps.
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Cache static frontend assets.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # React/Vite SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
