services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_EXPOSED_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - support-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SERVER_ERROR_INCLUDE_MESSAGE: ${SERVER_ERROR_INCLUDE_MESSAGE:-always}
      APP_DB_MODE: mysql
      SHOW_SQL: ${SHOW_SQL:-false}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      SEED_DATA: ${SEED_DATA:-true}
      ACTUATOR_ENDPOINTS: ${ACTUATOR_ENDPOINTS:-health,info}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_CREATE_DATABASE: ${MYSQL_CREATE_DATABASE:-true}
      MYSQL_SSL_MODE: DISABLED
      MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL: ${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:-true}
      MYSQL_SERVER_TIMEZONE: ${MYSQL_SERVER_TIMEZONE:-UTC}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-480}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:5173}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_ENDPOINT: ${OPENAI_ENDPOINT:-https://api.openai.com/v1/responses}
      OPENAI_CONNECT_TIMEOUT_SECONDS: ${OPENAI_CONNECT_TIMEOUT_SECONDS:-8}
      OPENAI_REQUEST_TIMEOUT_SECONDS: ${OPENAI_REQUEST_TIMEOUT_SECONDS:-25}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - support-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_API_TIMEOUT_MS: ${VITE_API_TIMEOUT_MS:-30000}
        VITE_ENABLE_DEMO_ACCOUNTS: ${VITE_ENABLE_DEMO_ACCOUNTS:-false}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:8080}
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    networks:
      - support-network

volumes:
  mysql_data:

networks:
  support-network:
    driver: bridge
